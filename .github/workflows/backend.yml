name: Backend validation

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main, "feat/**"]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ikigai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ikigai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/ikigai_test
      DATABASE_SSL: "false"
      NODE_ENV: test
      SESSION_PEPPER: ci-only-test-pepper
      APP_ORIGIN: http://127.0.0.1:3001
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Apply schema to real PostgreSQL
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f migrations/001_initial_schema.sql
      - name: Typecheck
        run: npm run typecheck
      - name: Unit and API security tests
        run: npm test
      - name: Build
        run: npm run build
