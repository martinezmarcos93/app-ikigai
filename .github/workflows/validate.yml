name: Validate prototype and API

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  prototype-checks:
    name: Prototype syntax, PWA assets, and product rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check api-client.js
          node --check portal.js
      - name: Set up Python for brand asset validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned asset validation dependency
        run: python -m pip install -r requirements-assets.txt
      - name: Validate generated Ikigai brand assets
        run: python scripts/validate-brand-assets.py
      - name: Validate PWA manifest and local asset paths
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';

          const manifest = JSON.parse(fs.readFileSync('manifest.webmanifest', 'utf8'));
          const requiredManifestFields = ['name', 'short_name', 'start_url', 'scope', 'display', 'background_color', 'theme_color'];
          const missingFields = requiredManifestFields.filter(field => !manifest[field]);
          if (missingFields.length) {
            console.error('Missing PWA manifest fields:', missingFields.join(', '));
            process.exit(1);
          }
          if (!Array.isArray(manifest.icons) || manifest.icons.length === 0) {
            console.error('The PWA manifest must declare at least one icon.');
            process.exit(1);
          }
          for (const icon of manifest.icons) {
            if (!icon.src || !icon.sizes || !icon.type) {
              console.error('Every PWA icon must declare src, sizes, and type.');
              process.exit(1);
            }
            const localPath = decodeURIComponent(new URL(icon.src, 'https://local.invalid/').pathname).slice(1);
            if (!fs.existsSync(path.resolve(localPath))) {
              console.error('PWA icon path does not exist:', icon.src);
              process.exit(1);
            }
          }

          const serviceWorker = fs.readFileSync('sw.js', 'utf8');
          const shellStart = serviceWorker.indexOf('const APP_SHELL = [');
          const shellEnd = shellStart < 0 ? -1 : serviceWorker.indexOf('];', shellStart);
          if (shellStart < 0 || shellEnd < 0) {
            console.error('Could not find APP_SHELL in sw.js.');
            process.exit(1);
          }
          const shellSource = serviceWorker.slice(shellStart, shellEnd + 1);
          const shellPaths = [...shellSource.matchAll(/['"]([^'"]+)['"]/g)].map(match => match[1]);
          for (const shellPath of shellPaths) {
            const localPath = decodeURIComponent(new URL(shellPath, 'https://local.invalid/').pathname).slice(1);
            if (!fs.existsSync(path.resolve(localPath))) {
              console.error('Service worker shell path does not exist:', shellPath);
              process.exit(1);
            }
          }
          if (!fs.existsSync('docs/ROADMAP_IMPLEMENTATION.md')) {
            console.error('Missing canonical implementation roadmap.');
            process.exit(1);
          }
          console.log(`PWA manifest valid; checked ${manifest.icons.length} icon(s) and ${shellPaths.length} app-shell path(s).`);
          NODE
      - name: Check core product rules are present
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app = fs.readFileSync('app.js', 'utf8');
          const required = [
            'bookingCutoffPassed',
            'promoteWaitlist',
            'state.attendance.push(record)',
            'monthlyPayments.push',
            'OBLIGACIÓN MENSUAL',
            'LISTA DE ESPERA'
          ];
          const missing = required.filter(term => !app.includes(term));
          if (missing.length) {
            console.error('Missing expected product rules:', missing.join(', '));
            process.exit(1);
          }
          if (app.includes('c.share') || app.includes('c.rate')) {
            console.error('Legacy coach revenue-share logic must not return.');
            process.exit(1);
          }
          console.log('Core product-rule smoke checks passed.');
          NODE

  api-checks:
    name: API typecheck, tests, build, and PostgreSQL migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ikigai
          POSTGRES_PASSWORD: ikigai_test
          POSTGRES_DB: ikigai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ikigai -d ikigai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://ikigai:ikigai_test@localhost:5432/ikigai_test
      IKIGAI_INTEGRATION_TESTS: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm ci --no-audit --no-fund
      - name: Type-check API
        run: npm run check
      - name: Apply schema migrations to disposable PostgreSQL
        run: npm run db:migrate
      - name: Install PostgreSQL client tools for backup verification
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Verify PostgreSQL backup and restore in an isolated database
        run: bash scripts/backup-restore-check.sh
      - name: Run API, domain, and PostgreSQL integration tests
        run: npm test
      - name: Build API
        run: npm run build
      - name: Verify migrations are repeatable
        run: npm run db:migrate
