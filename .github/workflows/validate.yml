name: Validate prototype and API

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "feat/**"]

permissions:
  contents: read

jobs:
  prototype-checks:
    name: Prototype syntax and product rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: node --check app.js
      - name: Validate PWA manifest
        run: node -e "const m = JSON.parse(require('fs').readFileSync('manifest.webmanifest', 'utf8')); if (!m.name || !m.start_url || !m.display) process.exit(1)"
      - name: Check core product rules are present
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const app = fs.readFileSync('app.js', 'utf8');
          const required = [
            'bookingCutoffPassed',
            'promoteWaitlist',
            'state.attendance.push(record)',
            'monthlyPayments.push',
            'OBLIGACIÓN MENSUAL',
            'LISTA DE ESPERA'
          ];
          const missing = required.filter(term => !app.includes(term));
          if (missing.length) {
            console.error('Missing expected product rules:', missing.join(', '));
            process.exit(1);
          }
          if (app.includes('c.share') || app.includes('c.rate')) {
            console.error('Legacy coach revenue-share logic must not return.');
            process.exit(1);
          }
          console.log('Core product-rule smoke checks passed.');
          NODE

  api-checks:
    name: API typecheck, tests, build, and PostgreSQL migration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ikigai
          POSTGRES_PASSWORD: ikigai_test
          POSTGRES_DB: ikigai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ikigai -d ikigai_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: server
    env:
      DATABASE_URL: postgres://ikigai:ikigai_test@localhost:5432/ikigai_test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install API dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check API
        run: npm run check
      - name: Run API and domain tests
        run: npm test
      - name: Build API
        run: npm run build
      - name: Apply initial schema to disposable PostgreSQL
        run: npm run db:migrate
      - name: Verify migration is repeatable
        run: npm run db:migrate
