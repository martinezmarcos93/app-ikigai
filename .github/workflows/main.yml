name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: test_db
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: '22.x'

    - name: Install dependencies and build (server)
      run: |
        cd server
        npm ci
        npm run build
      env:
        NODE_ENV: test
        DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db

    - name: Run typecheck (server)
      run: |
        cd server
        npm run check
      env:
        NODE_ENV: test
        DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db

    - name: Run migrations (server)
      run: |
        cd server
        npm run db:migrate
      env:
        NODE_ENV: test
        DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db

    - name: Run tests (server)
      run: |
        cd server
        npm run test
      env:
        NODE_ENV: test
        DATABASE_URL: postgres://test_user:test_password@localhost:5432/test_db

    - name: Run API client and first-run tests
      run: |
        node scripts/test-api-client.mjs
        node scripts/test-first-run.mjs
